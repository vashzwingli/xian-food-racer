name: Verify game
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run build:offline
      - run: npm test
      - run: npm run test:intro
      - run: npm run test:autoplay
      - run: npm run test:browser
      - run: npm run test:regression
      - run: node scripts/prepare-pages.mjs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: .pages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-verification
          path: |
            test-results/
            *verification.json
            menu.png
            rainstreet-market.png
            driveable-wall.png
            touch-driving.png
            cockpit-driving.png
            motion-blur-on.png
            motion-blur-off.png
            intro-loading.png
            intro-mobile.png
            bell-tower-entry.png
            gate-passage.png
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: game
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish verified game
        id: deployment
        uses: actions/deploy-pages@v4
